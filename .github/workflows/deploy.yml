name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
      deployInfra:
        description: Deploy Bicep before the app
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub environment holds secrets AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID;
    # add required reviewers on 'prod'.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infra
        if: inputs.deployInfra
        run: |
          az deployment sub create \
            --name "minicode-${{ inputs.environment }}-${{ github.run_number }}" \
            --location ${{ vars.AZURE_LOCATION || 'swedencentral' }} \
            --template-file infra/main.bicep \
            --parameters infra/env/${{ inputs.environment }}.bicepparam \
            --query properties.outputs -o json > outputs.json
          echo "functionApp=$(jq -r .functionAppName.value outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Resolve function app name
        id: app
        run: |
          name="${{ steps.infra.outputs.functionApp }}"
          if [ -z "$name" ]; then
            name=$(az functionapp list -g "rg-minicode-${{ inputs.environment }}" --query "[0].name" -o tsv)
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.app.outputs.name }}
          package: backend
          sku: flexconsumption
          remote-build: true

      - name: Smoke test
        run: |
          host=$(az functionapp show -g "rg-minicode-${{ inputs.environment }}" -n "${{ steps.app.outputs.name }}" --query defaultHostName -o tsv)
          for i in 1 2 3 4 5; do
            curl -fsS "https://$host/api/health" && exit 0
            sleep 15
          done
          exit 1
