name: Infra validate

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for what-if

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build + lint
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          for p in infra/env/*.bicepparam; do az bicep build-params --file "$p" --stdout > /dev/null; done

  what-if:
    # Enable by setting repository variable AZURE_WHATIF_ENABLED=true once OIDC is configured.
    if: vars.AZURE_WHATIF_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: |
          az deployment sub what-if \
            --location ${{ vars.AZURE_LOCATION || 'swedencentral' }} \
            --template-file infra/main.bicep \
            --parameters infra/env/${{ matrix.env }}.bicepparam
