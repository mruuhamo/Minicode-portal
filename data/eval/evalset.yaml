# Model comparison eval set (week 3). 20 items:
#  * 7 with transcripts (the mock ingestion samples in backend/minicode/samples/, 4 Teams VTT + 3 Speech)
#  * 13 title-only items from data/recordings/titles.txt (tests what a model does with little evidence)
# Gold labels are a human first pass (Week 3) - review/adjust them in the tag spot check before trusting scores.
#   topics:        every acceptable topic tag; predicted tags outside this list count as false positives
#   primary:       the tag a correct answer must contain (recall is measured against `primary` + 0.5 x the rest)
#   content_type:  acceptable content types
#   level:         expected level; within +-100 counts as correct
#   presenter:     expected presenter (null = unknown / not checkable)
reference_date: "2026-11-20"   # sample dates = reference_date - days_ago (deterministic, inside the 12-month window)
