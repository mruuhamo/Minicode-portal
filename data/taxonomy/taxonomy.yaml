        label: Conferences & community events
        keywords: [conference, conf, microsoft build, build 2018, build 2024, build 2025, fabcon, agentcon,
                   disobey, kyberlahti, hackday, data natives, builtstuff, sql europe, from my bubble]
      - id: customer-projects
        label: Customer projects & project intros
        keywords: [project intro, poc intro, projekti-intro, seure, seuren, valmet, energinet, sponda, digita,
                   kuusakoski, axla, jakamo, disior, monitzion]
      - id: general
        label: General / unclassified (needs manual review)
        keywords: []

  content_type:
    description: Format of the session. Single-valued; first matching rule wins.
    multi: false
    default: knowledge-share
    tags:
      - id: project-intro
        label: Project / customer introduction
        keywords: [project intro, poc intro, projekti-intro]
      - id: training
        label: Training (incl. guild & mandatory trainings)
        keywords: [training, minitraining, koulutus, guild, mandatory, workshop, handbook]
      - id: conference-recap
        label: Conference / event recap
        keywords: [conference, conf, build 2018, build 2024, build 2025, fabcon, agentcon, disobey, kyberlahti,
                   hackday, recap, highlights, news, sql europe]
      - id: case-study
        label: Case study, lessons learned & retrospectives
        keywords: [case, lessons learned, lessons learnt, experiences, retrospective, in production, poc project,
                   mishap, making of, using ai in the seure project, criticize]
      - id: demo
        label: Demo / tool walkthrough
        keywords: [demo, walkthrough, up and running, setup, emulator]
      - id: knowledge-share
        label: Knowledge share / talk
        keywords: []

  level:
    description: Expected prior knowledge, Microsoft-style 100-400. Single-valued.
    multi: false
    default: 200
    tags:
      - id: 100
        label: "100 - Introductory: no prior knowledge needed"
        keywords: [level 100, "101", intro, introduction, basics, fundamentals, first steps, get started,
                   getting started, up and running, for all, what is, what the hell is, topic intro, overview]
      - id: 200
        label: "200 - Intermediate: familiar with the basics"
        keywords: [level 200, "201"]
      - id: 300
        label: "300 - Advanced: hands-on experience expected"
        keywords: [level 300, advanced, in-depth, under the hood, deep dive, managed hsm, fine-tuning]
      - id: 400
        label: "400 - Expert: internals and edge cases"
        keywords: [level 400, internals, transformer architecture]
