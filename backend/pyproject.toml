[project]
name = "minicode-backend"
version = "0.1.0"
description = "Minicode Learning Section backend: ingestion, enrichment and search API (Azure Functions, Python)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long parametrized title tables are clearer on one line
